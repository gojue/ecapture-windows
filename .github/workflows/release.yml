name: Release
on:
  push:
    tags:
      - "v*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: ubuntu-24.04
    name: release Windows Version (amd64/arm64)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.12'

      - name: Check Release Type
        id: release_type
        run: |
          TAG_NAME="$GITHUB_REF_NAME"
          if [[ "$TAG_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Stable release detected: $TAG_NAME"
          elif [[ "$TAG_NAME" =~ (alpha|beta|rc) ]]; then
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=prerelease" >> $GITHUB_OUTPUT
            echo "🚧 Pre-release detected: $TAG_NAME"
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "RELEASE_TYPE=stable" >> $GITHUB_OUTPUT
            echo "📦 Release: $TAG_NAME"
          fi
        shell: bash

      - name: Install MinGW (for schannel_hook.dll)
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-mingw-w64-x86-64 mingw-w64-x86-64-dev

      - name: Get Previous Tag
        id: previoustag
        run: |
          PREVIOUS=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          echo "PREVIOUS_TAG=$PREVIOUS" >> "$GITHUB_OUTPUT"

      - name: Generate Release Notes
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_TAG: ${{ steps.previoustag.outputs.PREVIOUS_TAG }}
        run: |
          args=(-f "tag_name=${GITHUB_REF_NAME}")
          if [[ -n "$PREVIOUS_TAG" ]]; then
            args+=(-f "previous_tag_name=${PREVIOUS_TAG}")
          fi
          mkdir -p bin
          gh api --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
            "${args[@]}" | jq -er .body > bin/release_notes.txt
          test -s bin/release_notes.txt

      - name: Release Windows (amd64/arm64)
        env:
          SNAPSHOT_VERSION: ${{ github.ref_name }}
        run: |
          make -f builder/Makefile.release release_windows "SNAPSHOT_VERSION=$SNAPSHOT_VERSION"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          IS_PRERELEASE: ${{ steps.release_type.outputs.IS_PRERELEASE }}
          SNAPSHOT_VERSION: ${{ github.ref_name }}
        run: |
          make -f builder/Makefile.release publish "SNAPSHOT_VERSION=$SNAPSHOT_VERSION"
